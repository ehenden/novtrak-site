<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111713">
  <meta name="description" content="Novtrak. Müzik, teknolojiyle aynı frekansta. Yeni bir üretim alanı hazırlanıyor.">
  <title>Novtrak — Sesin bir sonraki hâli</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111713'/%3E%3Cpath d='M8 24V8l16 16V8' fill='none' stroke='%23b4c2a0' stroke-width='3'/%3E%3C/svg%3E">
  <style>
    :root{color-scheme:dark;--bg:#111713;--ink:#eef0e7;--muted:#a0aa9b;--accent:#b4c2a0;--line:#354135}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}button{font:inherit}a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:6px}.shell{max-width:1480px;padding:0 6vw;margin:auto}
    header{height:104px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:13px;font-size:26px;font-weight:700;letter-spacing:-1px}.mark{width:30px;height:30px}.edition{font-family:monospace;font-size:12px;letter-spacing:2px;color:var(--muted)}
    main{padding-top:74px}.hero{display:grid;grid-template-columns:1.15fr 1fr;align-items:center;gap:48px;min-height:480px}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin:0 0 28px}h1{font-size:clamp(56px,6.8vw,98px);line-height:1.02;font-weight:400;letter-spacing:-5px;margin:0 0 30px}.accent{color:var(--accent)}.intro{font-size:18px;line-height:1.6;color:var(--muted);margin:0;max-width:390px}
    .signal{position:relative;display:flex;flex-direction:column;justify-content:center;height:370px;isolation:isolate}.signal:before{content:"";position:absolute;inset:-30px;background:radial-gradient(ellipse,var(--glow,#b4c2a00d),transparent 68%);z-index:-1;transition:background 1s}.signal-top,.signal-bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font:12px monospace;letter-spacing:1px}.signal-top{padding:0 0 25px}.signal-bottom{padding-top:24px}.signal-name{color:var(--accent)}.wave{display:flex;align-items:center;justify-content:center;gap:5px;height:235px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:repeating-linear-gradient(90deg,transparent 0,transparent 49px,#b4c2a006 50px),repeating-linear-gradient(0deg,transparent 0,transparent 46px,#b4c2a006 47px)}.wave i{display:block;width:6px;max-width:1.5%;height:var(--h);background:var(--accent);border-radius:5px;opacity:var(--o,.8);transform-origin:center;animation:breathe 6s ease-in-out infinite;animation-delay:var(--d,0s)}@keyframes breathe{50%{transform:scaleY(.76);opacity:.5}}.playing .wave i{animation-name:resonate;animation-duration:2.7s}.playing .signal{--glow:#b4c2a01d}@keyframes resonate{0%,100%{transform:scaleY(.85)}50%{transform:scaleY(1.04);opacity:1}}
    .sound{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--line);border-radius:50px;color:var(--accent);background:transparent;padding:11px 16px;font-size:14px;cursor:pointer;transition:background .2s,border-color .2s}.sound:hover,.sound[aria-pressed=true]{background:#b4c2a012;border-color:var(--accent)}.sound-icon{display:flex;align-items:center;gap:3px;height:16px}.sound-icon i{width:2px;background:currentColor;height:8px}.sound-icon i:nth-child(2){height:15px}.sound-icon i:nth-child(3){height:11px}.sound-icon i:nth-child(4){height:5px}
    .studio-line{display:flex;align-items:center;justify-content:space-between;gap:30px;margin-top:50px;padding:30px 0;border-top:1px solid var(--line);color:var(--muted);font-size:14px}.studio-line p{margin:0}.track{display:flex;align-items:center;gap:7px;flex:1;max-width:330px}.track span{height:3px;background:var(--accent);opacity:.18;border-radius:10px}.track span:nth-child(1){width:27%}.track span:nth-child(2){width:12%;opacity:.5}.track span:nth-child(3){width:39%;opacity:.3}.track span:nth-child(4){width:22%;opacity:.7}.contact{padding:52px 0 68px;display:flex;align-items:baseline;justify-content:space-between;gap:25px}.contact h2{font-size:clamp(24px,2.7vw,38px);font-weight:400;letter-spacing:-1px;margin:0}.contact a{font-size:18px;color:var(--accent);border-bottom:1px solid #b4c2a060;padding-bottom:5px;transition:border-color .2s}.contact a:hover{border-color:var(--accent)}footer{border-top:1px solid var(--line);padding:25px 0 28px;color:var(--muted);font-size:12px}
    @media(min-width:1700px){.hero{min-height:570px}}@media(max-width:850px){.shell{padding:0 7vw}header{height:80px}main{padding-top:50px}.hero{grid-template-columns:1fr;gap:40px;min-height:0}h1{font-size:76px;letter-spacing:-4px}.signal{height:310px}.wave{height:225px}.signal-top{padding-bottom:18px}.signal-bottom{padding-top:18px}.studio-line{margin-top:42px}.contact{padding:42px 0 52px;align-items:flex-start;flex-direction:column;gap:24px}}
    @media(max-width:540px){header{height:74px}.brand{font-size:24px}.edition{font-size:12px;letter-spacing:1px}.mark{width:26px;height:26px}main{padding-top:43px}.eyebrow{font-size:12px;letter-spacing:1px;margin-bottom:24px}h1{font-size:clamp(48px,13vw,67px);letter-spacing:-2.8px;margin-bottom:25px}.intro{font-size:16px}.hero{gap:30px}.signal{height:285px}.wave{gap:4px;height:190px}.wave i{width:5px;height:calc(var(--h) * .74)}.signal-top,.signal-bottom{font-size:12px;letter-spacing:.3px}.signal-bottom{align-items:center}.sound{padding:10px 13px}.studio-line{margin-top:28px;padding:26px 0;gap:20px}.track{max-width:80px}.contact h2{font-size:27px}.contact a{font-size:17px}}
    @media(prefers-reduced-motion:reduce){.wave i,.playing .wave i{animation:none}a,button,.signal:before{transition:none}}
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <a class="brand" href="#" aria-label="Novtrak ana sayfa"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 25V7l20 18V7" fill="none" stroke="#b4c2a0" stroke-width="2.6"/></svg>novtrak</a>
      <span class="edition">SES × TEKNOLOJİ</span>
    </header>
    <main>
      <div class="hero">
        <div class="copy">
          <p class="eyebrow">Yeni bir üretim alanı</p>
          <h1>Sesin<br><span class="accent">bir sonraki<br>hâli.</span></h1>
          <p class="intro">Müzik, teknolojiyle aynı frekansta.</p>
        </div>
        <div class="signal">
          <div class="signal-top" aria-hidden="true"><span class="signal-name">NOVTRAK / SIGNAL</span><span>110 Hz</span></div>
          <div class="wave" aria-hidden="true">
            <i style="--h:12px;--o:.35"></i><i style="--h:22px;--o:.4"></i><i style="--h:34px;--o:.4"></i><i style="--h:18px;--o:.45"></i><i style="--h:47px;--o:.5"></i><i style="--h:69px;--o:.55"></i><i style="--h:41px;--o:.5"></i><i style="--h:93px;--d:-1s"></i><i style="--h:120px;--d:-1s"></i><i style="--h:84px;--d:-1s"></i><i style="--h:146px;--d:-1s"></i><i style="--h:175px;--d:-2s"></i><i style="--h:132px;--d:-2s"></i><i style="--h:199px;--d:-2s"></i><i style="--h:225px;--d:-2s"></i><i style="--h:186px;--d:-2s"></i><i style="--h:154px;--d:-3s"></i><i style="--h:203px;--d:-3s"></i><i style="--h:174px;--d:-3s"></i><i style="--h:123px;--d:-3s"></i><i style="--h:87px;--d:-3s"></i><i style="--h:137px;--d:-4s"></i><i style="--h:167px;--d:-4s"></i><i style="--h:116px;--d:-4s"></i><i style="--h:79px;--d:-4s"></i><i style="--h:104px;--d:-4s"></i><i style="--h:65px;--o:.6"></i><i style="--h:43px;--o:.5"></i><i style="--h:73px;--o:.55"></i><i style="--h:54px;--o:.5"></i><i style="--h:31px;--o:.45"></i><i style="--h:46px;--o:.4"></i><i style="--h:20px;--o:.35"></i><i style="--h:12px;--o:.3"></i>
          </div>
          <div class="signal-bottom"><span>Frekansı hisset.</span><button class="sound" type="button" aria-pressed="false"><span class="sound-icon" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="sound-label">Sesi aç</span></button></div>
        </div>
      </div>
      <div class="studio-line"><p>Novtrak hazırlanıyor.</p><div class="track" aria-hidden="true"><span></span><span></span><span></span><span></span></div></div>
      <section class="contact" aria-label="İletişim"><h2>Aynı frekansta buluşalım.</h2><a href="mailto:esat@novtrak.com">esat@novtrak.com</a></section>
    </main>
    <footer>© 2026 Novtrak</footer>
  </div>
  <script>
    const soundButton = document.querySelector('.sound');
    const soundLabel = document.querySelector('.sound-label');
    let soundContext = null;
    let masterGain = null;
    let soundPending = false;
    function stopSound() {
      const previousContext = soundContext;
      if (!previousContext) return;
      masterGain.gain.setTargetAtTime(0, previousContext.currentTime, 0.06);
      soundContext = null;
      masterGain = null;
      soundButton.setAttribute('aria-pressed', 'false');
      soundLabel.textContent = 'Sesi aç';
      document.body.classList.remove('playing');
      setTimeout(() => previousContext.close().catch(() => {}), 350);
    }
    soundButton.addEventListener('click', async () => {
      if (soundPending) return;
      if (soundContext) { stopSound(); return; }
      soundPending = true;
      try {
        const AudioContextType = window.AudioContext || window.webkitAudioContext;
        const context = new AudioContextType();
        soundContext = context;
        masterGain = context.createGain();
        masterGain.gain.value = 0;
        masterGain.connect(context.destination);
        const filter = context.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 560;
        filter.Q.value = 0.5;
        filter.connect(masterGain);
        [110, 164.81, 220].forEach((frequency, index) => {
          const oscillator = context.createOscillator();
          const voiceGain = context.createGain();
          oscillator.type = index === 0 ? 'sine' : 'triangle';
          oscillator.frequency.value = frequency;
          oscillator.detune.value = index === 1 ? -3 : 0;
          voiceGain.gain.value = index === 0 ? 0.5 : 0.15;
          oscillator.connect(voiceGain);
          voiceGain.connect(filter);
          oscillator.start();
        });
        await context.resume();
        if (document.hidden || soundContext !== context) { stopSound(); return; }
        masterGain.gain.setTargetAtTime(0.065, context.currentTime, 0.45);
        soundButton.setAttribute('aria-pressed', 'true');
        soundLabel.textContent = 'Sesi kapat';
        document.body.classList.add('playing');
      } catch {
        if (soundContext) { soundContext.close().catch(() => {}); soundContext = null; }
        masterGain = null;
        soundLabel.textContent = 'Ses kullanılamıyor';
      } finally { soundPending = false; }
    });
    document.addEventListener('visibilitychange', () => { if (document.hidden) stopSound(); });
    window.addEventListener('pagehide', stopSound);
  </script>
</body>
</html>
